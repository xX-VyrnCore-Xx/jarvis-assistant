# Un solo servizio Free (744 h/mese < 750 h gratuite): JARVIS pubblico + FreeLLMAPI interno.
services:
  - type: web
    name: jarvis-ai
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: OWNER_NAME
        value: signore
      # JARVIS
      - key: JARVIS_API_TOKEN
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_OWNER_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      # FreeLLMAPI: il disco è effimero, quindi DB cifrato salvato su Hugging Face e chiavi dei provider da config
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: FREEAPI_DB_BACKUP_URL
        sync: false
      - key: FREEAPI_DB_BACKUP_TOKEN
        sync: false
      - key: FREEAPI_CONFIG_JSON
        sync: false
