# Un solo servizio Free (744 h/mese < 750 h gratuite): JARVIS pubblico + FreeLLMAPI interno.
services:
  - type: web
    name: jarvis-ai
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: OWNER_NAME
        value: signore
      # JARVIS
      - key: JARVIS_API_TOKEN
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_OWNER_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      # FreeLLMAPI: il disco è effimero, quindi DB cifrato salvato su Hugging Face e chiavi dei provider da config
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: FREEAPI_DB_BACKUP_URL
        sync: false
      - key: FREEAPI_DB_BACKUP_TOKEN
        sync: false
      - key: FREEAPI_CONFIG_JSON
        sync: false
      # SiliconFlow è l'unico dei nuovi provider che vuole una chiave; OVH, Kilo e la ricerca Parallel funzionano senza
      - key: SILICONFLOW_API_KEY
        sync: false
      # backup del DB di FreeLLMAPI ogni 30 min (meno commit sul dataset); Supabase viene salvato cifrato ogni notte
      - key: FREEAPI_BACKUP_INTERVAL_MS
        value: "1800000"
      # notifiche push Android: JSON dell'account di servizio Firebase (vedi README, sezione Notifiche)
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # privacy verso i modelli: off | standard (IBAN, carte, chiavi, password, codice fiscale) | strict (anche email e telefoni)
      - key: PRIVACY_MODE
        value: standard
      # secondo cervello: famiglia di embedding di FreeLLMAPI (bge-m3 = multilingue, serve la chiave Cloudflare o Hugging Face; 'auto' = predefinita del router)
      - key: RAG_EMBED_MODEL
        value: bge-m3
      # ora del buongiorno automatico (0 = spento)
      - key: BRIEFING_HOUR
        value: "8"
