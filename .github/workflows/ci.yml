name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: server/requirements-dev.txt }
      - run: pip install -r server/requirements-dev.txt
      - run: pytest -q
        working-directory: server

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }
      - run: npm ci
        working-directory: desktop
      - name: Test sicurezza percorsi
        run: rustc --edition 2021 --test src/paths.rs -o paths_test.exe; ./paths_test.exe
        working-directory: desktop/src-tauri
      - run: npx tauri build
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      # solo la logica pura: le librerie audio/ML non servono ai test
      - run: pip install pytest numpy python-dotenv
      - run: pytest -q
        working-directory: voice

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jarvis-all .
      - name: Smoke test del container unico
        run: |
          docker run -d --name j -p 10000:10000 -e PORT=10000 \
            -e ENCRYPTION_KEY=$(openssl rand -hex 32) -e JARVIS_API_TOKEN=ci jarvis-all
          ok=0; for i in $(seq 1 60); do curl -fsS localhost:10000/health && ok=1 && break; sleep 2; done
          test $ok = 1
          ok=0; for i in $(seq 1 60); do
            docker exec j node -e "fetch('http://127.0.0.1:3001/api/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" && ok=1 && break; sleep 2
          done
          test $ok = 1
          # JARVIS (utente node) legge la chiave unificata dal DB di FreeLLMAPI
          docker exec -u node -w /srv/jarvis j /opt/venv/bin/python -c \
            "from app.llm import read_unified_key as r; k=r('/app/server/data/freellmapi.db'); assert k.startswith('freellmapi-'); print('chiave unificata ok')"
          # FreeLLMAPI non deve essere raggiungibile dall'esterno del container (solo loopback)
          if docker exec j node -e "const ip=Object.values(require('os').networkInterfaces()).flat().find(i=>!i.internal&&i.family==='IPv4').address;fetch('http://'+ip+':3001/api/ping').then(()=>process.exit(0)).catch(()=>process.exit(1))"; then
            echo "FreeLLMAPI è esposto fuori dal loopback"; exit 1
          fi
      - if: failure()
        run: docker logs j
