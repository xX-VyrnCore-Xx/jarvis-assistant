name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # GitHub ignora in silenzio i workflow con YAML non valido (nessun errore, il file semplicemente non parte)
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q pyyaml
          python - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob(".github/workflows/*.yml")):
              try:
                  d = yaml.safe_load(open(f))
                  assert isinstance(d, dict) and "jobs" in d and (True in d or "on" in d), "mancano on/jobs"
                  print("ok", f)
              except Exception as e:
                  bad += 1
                  print("ERRORE", f, e)
          sys.exit(1 if bad else 0)
          PY

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: server/requirements-dev.txt }
      - run: pip install -r server/requirements-dev.txt
      - run: pytest -q
        working-directory: server

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }
      - run: npm ci
        working-directory: desktop
      - name: Test sicurezza percorsi
        run: rustc --edition 2021 --test src/paths.rs -o paths_test.exe; ./paths_test.exe
        working-directory: desktop/src-tauri
      - run: npx tauri build
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      # solo la logica pura: le librerie audio/ML non servono ai test
      - run: pip install pytest numpy python-dotenv
      - run: pytest -q
        working-directory: voice

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jarvis-all .
      - name: Smoke test del container unico
        run: |
          docker run -d --name jarvis-ci -p 10000:10000 -e PORT=10000 \
            -e ENCRYPTION_KEY=$(openssl rand -hex 32) -e JARVIS_API_TOKEN=ci jarvis-all
          ok=0; for i in $(seq 1 60); do curl -fsS localhost:10000/health && ok=1 && break; sleep 2; done
          test $ok = 1
          ok=0; for i in $(seq 1 60); do
            docker exec jarvis-ci node -e "fetch('http://127.0.0.1:3001/api/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" && ok=1 && break; sleep 2
          done
          test $ok = 1
          # JARVIS (utente node) legge la chiave unificata dal DB di FreeLLMAPI
          docker exec -u node -w /srv/jarvis jarvis-ci /opt/venv/bin/python -c \
            "from app.llm import read_unified_key as r; k=r('/app/server/data/freellmapi.db'); assert k.startswith('freellmapi-'); print('chiave unificata ok')"
          # Gateway pubblico: /v1 passa (con la chiave unificata), la dashboard /api no
          KEY=$(docker exec -u node -w /srv/jarvis jarvis-ci /opt/venv/bin/python -c "from app.llm import read_unified_key as r; print(r('/app/server/data/freellmapi.db'))")
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:10000/v1/models)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $KEY" localhost:10000/v1/models)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:10000/api/keys)" = 404
          # l'endpoint con le credenziali per le altre app richiede il token di JARVIS
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:10000/admin/freellm)" = 401
          curl -fsS -H "Authorization: Bearer ci" localhost:10000/admin/freellm | grep -q '"api_key"'
          # FreeLLMAPI non deve essere raggiungibile dall'esterno del container (solo loopback)
          if docker exec jarvis-ci node -e "const ip=Object.values(require('os').networkInterfaces()).flat().find(i=>!i.internal&&i.family==='IPv4').address;fetch('http://'+ip+':3001/api/ping').then(()=>process.exit(0)).catch(()=>process.exit(1))"; then
            echo "FreeLLMAPI è esposto fuori dal loopback"; exit 1
          fi
      - name: Una configurazione FreeLLMAPI sbagliata non deve far cadere il servizio
        run: |
          check() {  # $1 = nome container, $2 = JSON, $3 = testo atteso nei log
            docker run -d --name "$1" -p 10001:10001 -e PORT=10001 -e ENCRYPTION_KEY=$(openssl rand -hex 32) \
              -e JARVIS_API_TOKEN=ci -e FREEAPI_CONFIG_JSON="$2" jarvis-all
            ok=0; for i in $(seq 1 60); do curl -fsS localhost:10001/health >/dev/null && ok=1 && break; sleep 2; done
            test $ok = 1
            ok=0; for i in $(seq 1 90); do
              docker exec "$1" node -e "fetch('http://127.0.0.1:3001/api/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" && ok=1 && break; sleep 2
            done
            test $ok = 1
            docker logs "$1" 2>&1 | grep -q "$3"
            docker rm -f "$1" >/dev/null
          }
          check jarvis-badsyntax '{"keys":[{"platform":"groq","key":"x"} {"platform":"google","key":"y"}]}' 'NON valido'
          check jarvis-badplatform '{"keys":[{"platform":"nonesiste","key":"x"}]}' 'riprovo SENZA configurazione'
      - if: failure()
        run: docker logs jarvis-ci

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: mobile/scripts/build-android.sh 0.0.0-ci 1
      - uses: actions/upload-artifact@v4
        with: { name: JARVIS-android-debug, path: mobile/out/*.apk }
