name: Release

# Si avvia a mano (Actions → Release → Run workflow) indicando la versione, es. 0.2.0.
# Costruisce l'installer Windows e l'APK Android e pubblica una Release GitHub con entrambi.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versione (es. 0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          [[ "$INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "versione non valida: $INPUT"; exit 1; }
          echo "version=$INPUT" >> "$GITHUB_OUTPUT"

  windows:
    needs: check
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }
      - run: npm ci
        working-directory: desktop
      - name: Imposta la versione
        shell: bash
        run: sed -i "s/\"version\": \"0.1.0\"/\"version\": \"$VERSION\"/" desktop/src-tauri/tauri.conf.json
      - run: npx tauri build
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

  android:
    needs: check
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: mobile/scripts/build-android.sh "$VERSION" "$GITHUB_RUN_NUMBER"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: mobile/out/*.apk

  publish:
    needs: [check, windows, android]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Checksum e note
        run: |
          cd dist
          sha256sum windows/*.exe android/*.apk | tee ../SHA256SUMS.txt
          cat > ../notes.md <<'NOTES'
          ## Installazione
          - **Windows**: esegui l'installer `.exe`. Se SmartScreen avvisa che l'app non è firmata, scegli *Ulteriori informazioni → Esegui comunque*.
          - **Android**: scarica l'`.apk`, aprilo e consenti l'installazione da questa origine quando richiesto.

          Al primo avvio apri ⚙ e inserisci il token personale (`JARVIS_API_TOKEN`); l'URL del server è già impostato.
          Verifica i file con `SHA256SUMS.txt`.
          NOTES
      - name: Crea la Release
        run: |
          gh release create "v$VERSION" dist/windows/*.exe dist/android/*.apk SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "JARVIS v$VERSION" --notes-file notes.md
